# Default profile. Model ids per harness; null means "inherit, never pass one".
name: max20
lead:
  claude: { model: opus, effort: high, permission_mode: bypassPermissions }
  codex: { model: gpt-6-astra, effort: medium, permission_mode: yolo }
  grok: { model: grok-4.7-build-fast, effort: high }
lanes:
  codex: { model: gpt-6-luna, effort: xhigh }
  grok: { model: grok-4.7-build-fast, effort: high }
  claude: { model: sonnet, effort: high }
explore:
  claude: sonnet
review:
  # cross-family reviewer chosen from the lead's harness; `high` is used by
  # `lane review --risk high` (data migration, security path, public API)
  claude: { to: codex, model: gpt-6-luna, effort: xhigh, high: { model: gpt-6.1-sol, effort: medium }, fallback: [grok] }
  codex: { to: claude, model: opus, effort: high, fallback: [claude, grok] }
  grok: { to: codex, model: gpt-6-luna, effort: xhigh, high: { model: gpt-6.1-sol, effort: medium }, fallback: [codex, claude] }
# `lane route`: order before the ledger has evidence (lanes.jsonl in the state dir)
route: { order: [codex, claude, grok], self_max_files: 2, min_samples: 5, medium_max_files: 4, cost_min_samples: 10, cost_floor: 0.7 }
limits:
  max_concurrent_ceiling: 8
  verify_concurrent: 2
  worker_gib: 0.5
  verify_gib: 1.5
  reserve_gib: 4
  max_depth: 1
  report_max_bytes: 4096
  timeout_seconds: 1200
