    oracle: deterministic

  - id: T07
    family: T
    title: No cross review outside risk
    level: 4
    gate: v1
    task: "Ordinary feature with no migration, security path or API change."
    expected:
      - zero lane review runs
    oracle: deterministic

  - id: T08
    family: T
    title: Docs corpus is declared, versioned and searched on demand
    level: 0
