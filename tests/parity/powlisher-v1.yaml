    title: Routing pays off on volume, not on small edits
    level: 4
    gate: v1
    task: "Same two tasks as PW20, run once direct and once routed."
    expected:
      - small edit, direct is cheaper in total tokens
      - 8-file module, routed costs fewer tokens on the lead's quota at equal ACCEPT result
      - report shows total, per quota, cache included
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  - id: T06
    family: T
