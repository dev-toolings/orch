    probe: [git]

  - id: PW25
    family: D
    title: A second team checks the first
    source:
      url: https://x.com/powlisher/status/2057634302528213357
      date: 2026-05-22
      quote: "Et quand il doute… il mandate une autre équipe IA pour vérifier la première."
      verified: false
    level: 4
