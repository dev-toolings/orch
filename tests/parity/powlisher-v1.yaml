      verified: false
    level: 0
    gate: v1
    task: "A note saved by the lead is invisible to a plain session in the same project."
    expected:
      - the note is in the lead scope: orch mem search from a plain session returns nothing
    oracle: deterministic
    probe: [mem]

  - id: PW14
    family: M
    title: Gets better with use
    source:
      url: https://x.com/powlisher/status/2057634302528213357
      date: 2026-05-22
