    source:
      url: https://x.com/powlisher/status/2067257519391625418
      date: 2026-06-17
      quote: "chaque session peut à son tour faire spawn des agents spécialisés selon le besoin : frontend, backend, architecture, design, QA, recherche produit"
      verified: false
    level: 4
    gate: v1
    task: "Delegate the exploration of the export path to an explorer."
    expected:
