  # ---------------------------------------------------------------- T
  # Token budget. No Powlisher source: these guard the operator's goal of
  # saving tokens end to end (plan v4, audit of 2026-10-18).
  - id: T01
    family: T
    title: Global instructions stay small
    level: 0
    gate: v1
    expected:
      - ~/.claude/CLAUDE.md is at most 4096 bytes (35649 before the split)
    oracle: deterministic

  - id: T02
    family: T
    title: Lane wrapper makes no model call
    level: 0
    gate: v1
    expected:
      - lane spawns only the target harness CLI; no other model process
    oracle: deterministic

  - id: T03
    family: T
    title: Lane report is bounded
    level: 0
    gate: v1
    expected:
      - report printed to the lead is at most report_max_bytes of the profile
      - full logs are on disk, path given in the report
    oracle: deterministic

  - id: T04
    family: T
    title: Lead never ingests worker terminals or the orca-cli skill
    level: 4
    gate: v1
    expected:
      - no orca terminal read and no orca-cli skill load in the lead transcript
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  - id: T05
