    task: "Cite moi la bonne pratique de Symfony sous ADR"
    expected:
      - runs orch docs search --stack symfony before answering
      - cites symfony@7.4/controller/service.rst (ADR pattern, invokable controllers)
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]
