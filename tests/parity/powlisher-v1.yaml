    task: "Have the diff reviewed by a model of another family."
    expected:
      - reviewer runs on a different harness than the implementer
      - findings are reported, not silently applied
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  - id: PW26
    family: D
    title: Two-level delegation
    source:
