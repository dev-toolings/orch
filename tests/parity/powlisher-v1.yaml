    oracle: deterministic
    probe: [mem]

  - id: PW12
    family: M
    title: The lead decides what is worth keeping
    source:
      url: https://x.com/powlisher/status/2036381371640266789
      date: 2026-03-24
      quote: "Les agents pourront décider si ça les concernes ou pas"
      verified: false
    level: 3
    gate: v1
    task: "Session with one durable decision and three trivial facts, then end."
    expected:
