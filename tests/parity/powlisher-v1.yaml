# Powlisher parity corpus, v1 (draft, not executable yet)
#
# Purpose: turn every behavior Powlisher states publicly about Emilien,
# Juliette and Hublot into a testable scenario, map it to our lead, and
# record whether v1 is expected to pass or is gated by a decision.
#
# Evidence: X posts collected by a headless Grok worker on 2026-10-16
# (.ref/tasks/grok-powlisher.out.json). verified: true only when the post
# was also found by an independent web search.
#
# Fields
#   level   test plan level (docs/lead-design.md, "Comment tester"):
#           0 unit, 2 sandbox discovery, 3 live lead session,
#           4 live delegation, 5 uninstall
#   gate    v1             expected to pass in v1
#           partial        v1 passes an analog, not the full behavior
#           autonomy       needs: lead runs unattended (24/7, hooks, night jobs)
#           depth2         needs: workers may spawn their own workers
#           out            out of scope (real-world actions, money, messaging)
#   oracle  deterministic  checked from files or native logs
#           judged         rubric scored by a model from another family
#   probe   how the oracle reads the truth:
#           claude-log  ~/.claude/projects/<cwd>/<session>/subagents/*.meta.json
#                       (agentType, spawnDepth, worktreePath)
#           codex-log   ~/.codex/sessions/**/rollout-*.jsonl session_meta
#                       (source.subagent.thread_spawn.depth, agent_role)
#           grok-log    ~/.grok/sessions/<cwd>/<id>/ (usage.json, subagent dirs)
#           git         worktrees, branches, diff
#           mem         orch mem notes (<state>/mem/*, <repo>/.orch/mem)
#           orca        orca terminal list / read

schema_version: 1
corpus_id: powlisher-parity
version: 1.0.0-draft
created_at: 2026-10-16
harnesses: [claude, codex, grok]

families:
  P: persona and context
  M: memory
  D: delegation
  C: continuity
  A: autonomy
  O: observability
  S: self-improvement and resilience
  T: token budget

cases:
  # ---------------------------------------------------------------- P
  - id: PW01
    family: P
    title: The lead states its role
    source:
      url: https://x.com/powl_d/status/2079992017694683636
      date: 2026-10
      quote: "Pour l'instant, Emilien tourne en full Fable. et spawn des agents orchestria sous OPUS 4.8"
      verified: true
    note: >-
      2026-10-19 research found no evidence that Emilien "does not code"; the
      confirmed pattern is a named persona above the model. Our lead is Marius.
    level: 0
    gate: v1
    task: "Qui es-tu ?"
    expected:
      - answers as Marius, running on the model the harness reports (or "model unknown"), never as a bare harness name
      - names itself the lead developer
      - says it writes small changes itself and routes exploration and mechanical volume to lanes
    oracle: judged

  - id: PW02
    family: P
    title: Stack discovered, not hardcoded
    source:
      url: https://x.com/powlisher/status/2057634302528213357
      date: 2026-05-22
      quote: "Le plus fou c’est qu’Emilien partage notre système de mémoire persistante avec Juliette."
      verified: false
    level: 3
    gate: v1
    fixtures:
      repo: demo with bun.lock (TypeScript) and pyproject.toml (Python)
    task: "What stack does this project use, and which of my skills apply?"
    expected:
      - names Bun/TypeScript and Python from the lockfiles
      - names the matching skills from its harness skill list
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  - id: PW03
    family: P
    title: Operator preferences applied without being restated
    source:
      url: https://x.com/powlisher/status/2036381371640266789
      date: 2026-03-24
      quote: "une sorte de gazette interne qui alimente à la fois nos seconds cerveaux (Robin et moi) mais aussi l’ensemble de nos agents permanents"
      verified: false
    level: 3
    gate: v1
    task: "Add a script that installs dependencies and lints this project."
    expected:
      - uses bun, never npm or npx
      - no em dash in produced prose
      - does not start a dev server or a build
    oracle: deterministic
    probe: [git]

  # ---------------------------------------------------------------- M
  - id: PW10
    family: M
