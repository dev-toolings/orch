    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  # ---------------------------------------------------------------- D
  - id: PW20
    family: D
    title: Small change stays with the lead, volume is routed
    source:
      url: https://x.com/powlisher/status/2067257519391625418
      date: 2026-06-17
      quote: "Il a spawn 4 sessions Orchestria qu’il supervise en temps réel."
      verified: false
    divergence: Emilien delegates everything; ours keeps small edits to avoid the worker prefix cost.
    level: 4
    gate: v1
    task: "(a) Fix a one-line typo. (b) Add a CRUD module across 8 new files."
    expected:
      - (a) zero subagents, zero lanes
      - (b) exactly one lane run with a complete spec file, report read, no worker log read
    oracle: deterministic
    probe: [claude-log, codex-log, grok-log]

  - id: PW21
    family: D
